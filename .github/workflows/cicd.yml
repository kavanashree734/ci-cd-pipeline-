name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test files
        run: |
          test -f index.html
          test -f style.css

      - name: Deploy
        run: echo "Deploying website..."
